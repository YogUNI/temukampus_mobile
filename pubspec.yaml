name: temukampus_mobile
description: "Aplikasi Resmi Mahasiswa Universitas Mercu Buana"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.7.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State Management & Dependency Injection
  flutter_riverpod: ^2.6.1

  # Routing
  go_router: ^14.8.1

  # Networking
  dio: ^5.8.0+1

  # Local Storage & Security
  flutter_secure_storage: ^9.2.4
  shared_preferences: ^2.5.2

  # Fonts & UI Utilities
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.17
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0
  intl: ^0.19.0

  # Hardware: Camera, Image Picker & Scanner
  image_picker: ^1.1.2
  flutter_image_compress: ^2.4.0
  mobile_scanner: ^5.2.3
  qr_flutter: ^4.1.0

  # Interaction & Device Feedback
  flutter_vibrate: ^1.3.0
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
